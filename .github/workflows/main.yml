name: Run Myanmar Font Bot

concurrency:
  group: run-myanmar-font-bot
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours to keep refreshing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Run as close to max allowed time as possible
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Continuously
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          echo "Starting bot loop..."
          python bot.py
        continue-on-error: true
